# Render Blueprint: deploys this folder as a Static Site (free tier).
services:
  - type: web
    runtime: static
    name: astro-wreckage
    buildCommand: echo "Static site - nothing to build"
    staticPublishPath: .
    headers:
      - path: /*.jpg
        name: Cache-Control
        value: public, max-age=604800
      - path: /*.jpeg
        name: Cache-Control
        value: public, max-age=604800
      - path: /*.webp
        name: Cache-Control
        value: public, max-age=604800
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
